[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bungalow"
version = "0.1.0"
description = "Turns the Clearbook MCP's home-buying tools into one finished due-diligence pack. The product presents and prioritises; every fact comes from the MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Elliot Little" }]
keywords = ["conveyancing", "homebuyer", "mcp", "uk-property", "due-diligence", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
# The MCP backend talks to the running Clearbook/bungalow MCP server.
mcp = ["mcp>=1.0"]
# The optional plain-English brief is written by Claude.
brief = ["anthropic>=0.40"]
dev = [
    "anthropic>=0.40",
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
bungalow = "bungalow.cli:main"

[project.urls]
Homepage = "https://github.com/ElliotJLT/bungalow"

[tool.hatch.build.targets.wheel]
packages = ["src/bungalow"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/bungalow"]

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
